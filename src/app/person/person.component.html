<div class="main-wrapper">
  <div>
    <app-outer-frame></app-outer-frame>
  </div>
  <div class="wrapper">
    <div #scrollContainer class="scroll-container">
      <div class="scroll-content">
        <div class="wrapper_inner">
          <hr class="spacer100">
          <section>
            <h1 class="person-headline-wrapper">
              {{ 'about.title' | t }}
            </h1>
            <div class="column-left column50">
              <figure @fadeIn class="img_person ">
                <picture>
                  <img src="/assets/img/workspace.jpg" alt="Workspace with laptop and screen">
                </picture>
              </figure>
            </div>
            <article @fadeIn class="column-right column50">
              <p class="content-text"><strong>{{ 'about.lead' | t }}</strong></p>
              <p class="content-text">{{ 'about.p1' | t }}</p>
              <p class="content-text">{{ 'about.p2' | t }}</p>
              <p class="content-text">{{ 'about.training' | t }}</p>
            </article>
          </section>
          <hr class="spacer100_2">
        </div>
      </div>
    </div>
  </div>
  <div @fadeInOut class="transition-bg"></div>
  <app-cursor></app-cursor>
</div>
