<div class="main-wrapper">
  <div>
    <app-outer-frame [lightLogoText]="true"></app-outer-frame>
  </div>
</div>
<div class="wrapper">
  <div class="scroll-container">
    <div class="scroll-content">
      <div class="wrapper_inner">
        <hr class="spacer100">
        <section class="project-header">
          <article>
            <h1 class="project-headline-wrapper">
              <span class="project-headline-content">
                <span>{{ 'contact.title' | t }}</span>
              </span>
            </h1>
            <p class="project-description-wrapper">
              <span class="project-description-content">
                <span>{{ 'contact.intro' | t }}</span>
              </span>
            </p>
          </article>
        </section>

        <section class="contact-details">
          <p>{{ 'contact.mail' | t }}
            <a href="mailto:sayhello@thomastritscher.com">sayhello@thomastritscher.com</a>
          </p>
          <p>{{ 'contact.social' | t }}
            <a href="https://github.com/MikloVegaVL" target="_blank" rel="noopener">GitHub</a>
            &middot;
            <a href="https://www.linkedin.com/in/thomas-tritscher-40ab14213/" target="_blank" rel="noopener">LinkedIn</a>
          </p>
        </section>

        <app-entry-offer></app-entry-offer>
        <hr class="spacer100">
      </div>
    </div>
  </div>
</div>
