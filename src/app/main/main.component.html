<main>
  <div>
    <app-outer-frame></app-outer-frame>
  </div>
  <section [ngStyle]="{'opacity' : layer.img_opacity}" class="img-wrap">
    <div class="hero-frame">
      <div class="hero-seam"></div>
      <img src="/assets/img/hero-portrait.jpg" alt="Portrait of Thomas Tritscher dissolving into a code overlay">
      <div class="hero-curtain" [style.grid-template-columns]="'repeat(' + heroCubeCols + ', 1fr)'">
        @for (tile of heroCubeTiles; track $index) {
          <span class="hero-cube" [style.animation-delay.ms]="tile.delay"></span>
        }
      </div>
    </div>
  </section>
  <div class="bg-wrap">
    <div [ngStyle]="{ 'transform': transformBg.valueBg }" class="bg-left">
    </div>
  </div>
  <app-scrollhint></app-scrollhint>
  <app-h-nav class="hover_state"></app-h-nav>
  <app-sections></app-sections>
  <div @load class="transition-bg" ></div>
  <div #cursor class="cursor"></div>
  <div #cursor2 class="cursor2"></div>
</main>
