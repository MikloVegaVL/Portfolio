<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Abstract security audit visual</title>
  <desc id="desc">A dark teal background with a geometric shield, grid lines and an accent scan line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2a"/>
      <stop offset="1" stop-color="#123b3a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3d3cf"/>
      <stop offset="1" stop-color="#00796B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a3d3cf" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <path d="M600 130 L820 220 L820 440 C820 570 720 650 600 700 C480 650 380 570 380 440 L380 220 Z"
        fill="none" stroke="url(#shield)" stroke-width="6"/>
  <path d="M600 200 L750 262 L750 438 C750 530 680 590 600 628 C520 590 450 530 450 438 L450 262 Z"
        fill="#a3d3cf" fill-opacity="0.08" stroke="#a3d3cf" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M520 430 L580 490 L700 350" fill="none" stroke="#FF5722" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="120" y1="640" x2="1080" y2="640" stroke="#FF5722" stroke-opacity="0.5" stroke-width="2"/>
</svg>
